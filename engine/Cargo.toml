[package]
name = "rqbit-engine"
version = "0.1.0"
edition = "2021"
description = "DSAnima torrent sidecar engine (librqbit + axum): streaming magnet playback + SSE progress"
publish = false

[lib]
name = "rqbit_engine"
path = "src/lib.rs"

[[bin]]
name = "rqbit-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
librqbit = "9.0.1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

name: dsanima
description: "DSAnima 宿主外壳：实时磁力播放器（内嵌 ShikiiN 播放器 + rqbit 边车）。"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
#
# ⚠️ 改这里**必须同时改** `lib/domain/app_version.dart` 的 `kAppVersion`
# （检查更新的比较基准）；`test/app_version_test.dart` 会读本文件对账。
# 发布标签 = `v` + 三段号（`v1.0.5`），见 `tool/release_github.ps1`。
version: 1.0.5+6

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # ── 仓库内并行开发的 path 依赖 ─────────────────────────────────────────────
  # dsanima_core: 引擎客户端 / 源（nyaa·mikan·RSS）/ 订阅规则与队列（Dart 纯逻辑）
  dsanima_core:
    path: ../core
  # shikiin: 既有播放器改造出的可内嵌库包（bootstrapPlayer / ShikiinApp / 播放器控件）
  shikiin:
    path: ../ShikiiN

  # ── 状态与持久化 ───────────────────────────────────────────────────────────
  flutter_riverpod: ^3.3.2
  # Hive：宿主的 KeyValueStore（core 的持久化端口正本，见 state/hive_store.dart）。
  # `hive_flutter` **不要**加回来：app 侧没有一个 `package:hive_flutter/` 导入，
  # 真正调 `Hive.initFlutter` 的是 shikiin 的 bootstrap（它自己声明了该依赖）。
  # 声明在这里只会把一份没用的字体/插件塞进包（用户 2026-10-11：不要没用的库依赖）。
  hive: ^2.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  # 全仓唯一 HTTP 客户端（与 core 口径一致）：封面图缓存 / Bangumi API 用它。
  http: ^1.6.0
  # 扩展框架（1.1.0 M3）：读取 zip 的头/条目表、逐条目解压到 staging。
  # `archive` 本来就在依赖图里（file_picker 的传递依赖），这里只是提成**直接依赖**
  # 让 app 能 import —— 不新增任何原生代码、不新增包体（pubspec.lock 同一份版本）。
  # 为什么不用 `Expand-Archive`：需要**逐条目校验**（zip-slip / 炸弹 / 非法路径）
  # 才能决定"解不说得进去"，而且测试要能在内存里造恶意 zip（不能靠 PowerShell）。
  archive: ^4.3.0
  # sha256：包完整性校验（下载的 zip + 解压后的每个文件）。core 已在用，这里同样只是
  # 提成直接依赖（版本与 core 一致），不新增包。
  crypto: ^3.0.7

  # 「已完成」页的「删除文件」要进 **Windows 回收站**（用户 2026-10-12 第十四轮：
  # 「删除的可跳转文件夹位置，和直接播放还有删除等」+ 问答选定"删文件到回收站，可恢复"）。
  # 引擎那条 DELETE ?deleteFiles=true 是**永久删除**，没有回收站语义，所以这一件事
  # 必须自己做：`SHFileOperation(FO_DELETE | FOF_ALLOWUNDO)`。
  #
  # 两个包本来就在依赖图里（win32 是窗口/多窗口插件的传递依赖，ffi 是它的依赖），
  # 显式声明只是让 app 能直接 import —— **不新增任何原生代码**。版本跟着图里那份写。
  win32: ^5.15.0
  ffi: ^2.2.0

  # ── 桌面外壳 ───────────────────────────────────────────────────────────────
  window_manager: ^0.5.1
  # 显示器工作区（主窗口放在哪块屏、播放窗口该放哪）。
  #
  # 它本来就是 `window_manager` 的传递依赖、Windows 插件**早就在包**里
  # （`generated_plugin_registrant.cc` 里有 screen_retriever_windows），所以显式声明
  # **不会**多带任何原生代码进包 —— 只是让 app 能直接 import。
  # 用途见 `domain/window_placement.dart`（用户 2026-10-11：
  # 「只要启动了播放器，主窗口就没办法使用了」）。
  screen_retriever: ^0.2.1
  # 独立播放窗口（用户 2026-10-10 明确要求：**只有弹出窗口播放**，主窗口不播）。
  # 官方 API 做不到（stable 的 windowing 特性开关被锁死），第三方里唯一 Windows 可用的是它。
  # 代价：子窗口是**独立 Flutter 引擎/独立 isolate**，所以 mpv 实例不共享，
  # 播放器在子窗口里自持（探针实测：子窗口里 media_kit 硬解渲染正常）。
  # 另需在 `windows/runner/flutter_window.cpp` 加 2 处（见该文件注释）。
  desktop_multi_window: ^0.3.1
  # 与 shikiin 保持一致（该包 8.0.0 与 8.3.x API 有差异，锁定同一版本避免解析冲突）
  file_picker: 8.0.0
  tray_manager: ^0.5.3
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # 托盘图标：**真 .ico**（Windows 的 tray_manager 用 LoadImage/LR_LOADFROMFILE，
  # 必须是图标文件；把 PNG 改名成 .ico 会加载失败）。运行期写到支持目录再交给插件。
  # 与 windows/runner/resources/app_icon.ico 是同一份（换应用图标时两处一起换）。
  #
  # ⚠️ 库包的 asset 路径规则（本项目踩过两次，务必先读再改）：
  #   * **带包前缀**的 `packages/<pkg>/assets/...` 由「包依赖关系」自动进宿主 bundle，
  #     宿主**不需要**在这里声明（例如 shikiin 的 `packages/shikiin/assets/icon.png`
  #     就在包里，ShikiiN 侧用这个前缀即可）。
  #   * **无前缀**的 `assets/...` 即使在依赖包的 pubspec 里声明过，也**不会**进宿主
  #     bundle —— 库代码若要按无前缀路径读，宿主就必须像下面 anime4k 那样自己持有一份。
  assets:
    - assets/tray.ico
    # Anime4K（超分）shader：播放器的一个内置工具。
    # **必须由宿主自己声明**：shikiin 的 `unpackAnime4kShaders()` 是按无包前缀的
    # `assets/shaders/anime4k/<f>` 去 `rootBundle.load` 的（依赖包的 assets 不会
    # 自动进宿主 bundle），漏了这行启动就会报 `Unable to load asset` 并降级为关。
    # 目录形式：整目录 13 个 .glsl 一起进包（Anime4K 12 + Anime4K-Ultra 1，约 820 KB）。
    # 改 shader 内容/清单时：ShikiiN 侧改 `kAnime4kVersion` 触发重新解包，
    # 并把 ShikiiN/assets/shaders/anime4k/ 与这里同步（两处必须一致）。
    - assets/shaders/anime4k/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
